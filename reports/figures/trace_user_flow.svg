<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 905" width="100%" height="100%">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
    .node-title { font-weight: 600; }
    .node-desc { font-size: 11.5px; fill: #475569; }
    .edge-line { stroke: #64748b; stroke-width: 1.75; fill: none; }
    .edge-label-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
    .edge-label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #334155; text-anchor: middle; dominant-baseline: central; }
    .terminal { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.75; rx: 22; }
    .process { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 7; }
    .decision { fill: #fffbeb; stroke: #d97706; stroke-width: 1.75; }
    .fail-terminal { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 18; }
    .fail-process { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.5; rx: 7; }
  </style>

  <!-- ================= EDGES ================= -->
  <!-- Start -> CheckArgs -->
  <path d="M 520 68 L 520 114" class="edge-line" marker-end="url(#arrow)"/>

  <!-- CheckArgs -> PrintUsage (Left) -->
  <path d="M 425 150 L 293 150" class="edge-line" marker-end="url(#arrow)"/>

  <!-- PrintUsage -> ExitFail1 -->
  <path d="M 180 173 L 180 202" class="edge-line" marker-end="url(#arrow)"/>

  <!-- CheckArgs -> ParseMask (Bottom) -->
  <path d="M 520 186 L 520 218" class="edge-line" marker-end="url(#arrow)"/>

  <!-- ParseMask -> CallSysTrace -->
  <path d="M 520 262 L 520 298" class="edge-line" marker-end="url(#arrow)"/>

  <!-- CallSysTrace -> CheckSysTrace -->
  <path d="M 520 342 L 520 376" class="edge-line" marker-end="url(#arrow)"/>

  <!-- CheckSysTrace -> PrintTraceErr (Left) -->
  <path d="M 430 410 L 293 410" class="edge-line" marker-end="url(#arrow)"/>

  <!-- PrintTraceErr -> ExitFail2 -->
  <path d="M 180 433 L 180 462" class="edge-line" marker-end="url(#arrow)"/>

  <!-- CheckSysTrace -> PrepareArgs (Bottom) -->
  <path d="M 520 444 L 520 478" class="edge-line" marker-end="url(#arrow)"/>

  <!-- PrepareArgs -> ExecCall -->
  <path d="M 520 522 L 520 553" class="edge-line" marker-end="url(#arrow)"/>

  <!-- ExecCall -> CheckExec -->
  <path d="M 520 597 L 520 626" class="edge-line" marker-end="url(#arrow)"/>

  <!-- CheckExec -> PrintExecErr (Left) -->
  <path d="M 430 660 L 303 660" class="edge-line" marker-end="url(#arrow)"/>

  <!-- PrintExecErr -> ExitFail3 -->
  <path d="M 180 683 L 180 712" class="edge-line" marker-end="url(#arrow)"/>

  <!-- CheckExec -> RunTargetProg (Bottom) -->
  <path d="M 520 694 L 520 739" class="edge-line" marker-end="url(#arrow)"/>

  <!-- RunTargetProg -> EndSuccess -->
  <path d="M 520 791 L 520 831" class="edge-line" marker-end="url(#arrow)"/>

  <!-- ================= EDGE LABELS ================= -->
  <!-- CheckArgs -> PrintUsage: Không -->
  <g transform="translate(355, 150)">
    <rect x="-24" y="-10" width="48" height="20" class="edge-label-bg"/>
    <text y="0" class="edge-label-text">Không</text>
  </g>

  <!-- CheckArgs -> ParseMask: Có -->
  <g transform="translate(540, 202)">
    <rect x="-16" y="-10" width="32" height="20" class="edge-label-bg"/>
    <text y="0" class="edge-label-text">Có</text>
  </g>

  <!-- CheckSysTrace -> PrintTraceErr: Có (Lỗi) -->
  <g transform="translate(355, 410)">
    <rect x="-30" y="-10" width="60" height="20" class="edge-label-bg"/>
    <text y="0" class="edge-label-text" fill="#b91c1c">Có (Lỗi)</text>
  </g>

  <!-- CheckSysTrace -> PrepareArgs: Không (Thành công) -->
  <g transform="translate(585, 461)">
    <rect x="-56" y="-10" width="112" height="20" class="edge-label-bg"/>
    <text y="0" class="edge-label-text" fill="#15803d">Không (Thành công)</text>
  </g>

  <!-- CheckExec -> PrintExecErr: Không -->
  <g transform="translate(360, 660)">
    <rect x="-24" y="-10" width="48" height="20" class="edge-label-bg"/>
    <text y="0" class="edge-label-text">Không</text>
  </g>

  <!-- CheckExec -> RunTargetProg: Có -->
  <g transform="translate(540, 716)">
    <rect x="-16" y="-10" width="32" height="20" class="edge-label-bg"/>
    <text y="0" class="edge-label-text">Có</text>
  </g>

  <!-- ================= NODES ================= -->

  <!-- Start Node -->
  <g filter="url(#shadow)" transform="translate(520, 46)">
    <rect x="-145" y="-22" width="290" height="44" class="terminal"/>
    <text class="node-text node-title" y="0">Bắt đầu: trace [mask] [command] ...</text>
  </g>

  <!-- CheckArgs Node (Diamond) -->
  <g filter="url(#shadow)" transform="translate(520, 150)">
    <polygon points="0,-36 95,0 0,36 -95,0" class="decision"/>
    <text class="node-text node-title" y="-8">argc &gt;= 3 và</text>
    <text class="node-text node-desc" y="10">argv[1] hợp lệ?</text>
  </g>

  <!-- PrintUsage Node -->
  <g filter="url(#shadow)" transform="translate(180, 150)">
    <rect x="-105" y="-23" width="210" height="46" class="fail-process"/>
    <text class="node-text" y="-6">In hướng dẫn sử dụng</text>
    <text class="node-text node-desc" y="10">ra luồng stderr</text>
  </g>

  <!-- ExitFail1 Node -->
  <g filter="url(#shadow)" transform="translate(180, 220)">
    <rect x="-80" y="-18" width="160" height="36" class="fail-terminal"/>
    <text class="node-text node-title" y="0" fill="#991b1b">Thoát với mã lỗi 1</text>
  </g>

  <!-- ParseMask Node -->
  <g filter="url(#shadow)" transform="translate(520, 240)">
    <rect x="-160" y="-22" width="320" height="44" class="process"/>
    <text class="node-text" y="-7">Chuyển đổi <tspan font-family="monospace">argv[1]</tspan> thành số nguyên</text>
    <text class="node-text node-desc" y="9">Hàm <tspan font-family="monospace">atoi(argv[1])</tspan> &rarr; <tspan font-family="monospace">mask</tspan></text>
  </g>

  <!-- CallSysTrace Node -->
  <g filter="url(#shadow)" transform="translate(520, 320)">
    <rect x="-135" y="-22" width="270" height="44" class="process"/>
    <text class="node-text node-title" y="-7">Gọi system call</text>
    <text class="node-text node-desc" y="9">Hàm <tspan font-family="monospace">trace(mask)</tspan></text>
  </g>

  <!-- CheckSysTrace Node (Diamond) -->
  <g filter="url(#shadow)" transform="translate(520, 410)">
    <polygon points="0,-34 90,0 0,34 -90,0" class="decision"/>
    <text class="node-text node-title" y="0"><tspan font-family="monospace">trace(mask) &lt; 0</tspan>?</text>
  </g>

  <!-- PrintTraceErr Node -->
  <g filter="url(#shadow)" transform="translate(180, 410)">
    <rect x="-105" y="-23" width="210" height="46" class="fail-process"/>
    <text class="node-text" y="-6">In thông báo lỗi:</text>
    <text class="node-text node-desc" y="10"><tspan font-family="monospace">"trace failed"</tspan></text>
  </g>

  <!-- ExitFail2 Node -->
  <g filter="url(#shadow)" transform="translate(180, 480)">
    <rect x="-80" y="-18" width="160" height="36" class="fail-terminal"/>
    <text class="node-text node-title" y="0" fill="#991b1b">Thoát với mã lỗi 1</text>
  </g>

  <!-- PrepareArgs Node -->
  <g filter="url(#shadow)" transform="translate(520, 500)">
    <rect x="-140" y="-22" width="280" height="44" class="process"/>
    <text class="node-text" y="-7">Chuẩn bị mảng tham số</text>
    <text class="node-text node-desc" y="9">Con trỏ lấy từ <tspan font-family="monospace">&amp;argv[2]</tspan></text>
  </g>

  <!-- ExecCall Node -->
  <g filter="url(#shadow)" transform="translate(520, 575)">
    <rect x="-145" y="-22" width="290" height="44" class="process"/>
    <text class="node-text node-title" y="-7">Gọi hàm <tspan font-family="monospace">exec()</tspan></text>
    <text class="node-text node-desc" y="9">Chạy chương trình mục tiêu</text>
  </g>

  <!-- CheckExec Node (Diamond) -->
  <g filter="url(#shadow)" transform="translate(520, 660)">
    <polygon points="0,-34 90,0 0,34 -90,0" class="decision"/>
    <text class="node-text node-title" y="0">exec thành công?</text>
  </g>

  <!-- PrintExecErr Node -->
  <g filter="url(#shadow)" transform="translate(180, 660)">
    <rect x="-115" y="-23" width="230" height="46" class="fail-process"/>
    <text class="node-text" y="-6">In thông báo lỗi:</text>
    <text class="node-text node-desc" y="10"><tspan font-family="monospace">"trace: exec failed"</tspan></text>
  </g>

  <!-- ExitFail3 Node -->
  <g filter="url(#shadow)" transform="translate(180, 730)">
    <rect x="-80" y="-18" width="160" height="36" class="fail-terminal"/>
    <text class="node-text node-title" y="0" fill="#991b1b">Thoát với mã lỗi 0</text>
  </g>

  <!-- RunTargetProg Node -->
  <g filter="url(#shadow)" transform="translate(520, 765)">
    <rect x="-165" y="-26" width="330" height="52" class="process"/>
    <text class="node-text" y="-8">Chương trình mục tiêu tiếp quản tiến trình</text>
    <text class="node-text node-desc" y="11">(kế thừa <tspan font-family="monospace">trace_mask</tspan> đã thiết lập)</text>
  </g>

  <!-- EndSuccess Node -->
  <g filter="url(#shadow)" transform="translate(520, 852)">
    <rect x="-70" y="-20" width="140" height="40" class="terminal"/>
    <text class="node-text node-title" y="0" fill="#15803d">Hoàn tất</text>
  </g>
</svg>
